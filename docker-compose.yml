version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: traffic-funnel-mongodb
    # Default WiredTiger cache is (RAM-1GB)/2, oversized for this host's 3.7GB
    # WSL2 budget across 13 containers. Capping it stops mongo from being the
    # thing that gets squeezed (or squeezes everything else) under pressure.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 400m
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: traffic_funnel
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - funnel-network
    # Previously missing entirely -- the actual reason mongodb/redis were the
    # only two services on this stack that never came back after a crash or
    # a Docker Desktop restart, while every other service (which all have
    # this policy) auto-resurrected around them.
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: traffic-funnel-redis
    mem_limit: 150m
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - funnel-network
    restart: unless-stopped

  # Orchestrator Service
  orchestrator:
    build:
      context: ./python-services
      dockerfile: Dockerfile.orchestrator
    container_name: traffic-funnel-orchestrator
    ports:
      - "18000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GUMROAD_ACCESS_TOKEN=${GUMROAD_ACCESS_TOKEN}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - CONTENT_SERVICE_URL=http://content-generator:8001
      - EMAIL_SERVICE_URL=http://email-automation:8003
      - LEAD_SERVICE_URL=http://lead-optimizer:8002
      - CONVERSION_SERVICE_URL=http://conversion-optimizer:8004
      - GUMROAD_SERVICE_URL=http://gumroad-integration:8005
      - TRAFFIC_SERVICE_URL=http://traffic-acquisition:8006
      - SOCIAL_SERVICE_URL=http://social-media:8007
      - LLM_SERVICE_URL=http://llm-service:8008
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      content-generator:
        condition: service_started
      email-automation:
        condition: service_started
      lead-optimizer:
        condition: service_started
      conversion-optimizer:
        condition: service_started
      gumroad-integration:
        condition: service_started
      traffic-acquisition:
        condition: service_started
      social-media:
        condition: service_started
      llm-service:
        condition: service_started
    networks:
      - funnel-network
    restart: unless-stopped

  # Content Generation Service
  content-generator:
    build:
      context: ./python-services
      dockerfile: Dockerfile.content
    container_name: traffic-funnel-content
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - LLM_SERVICE_URL=http://llm-service:8008
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_started
    networks:
      - funnel-network
    restart: unless-stopped

  # Lead Optimization Service
  lead-optimizer:
    build:
      context: ./python-services
      dockerfile: Dockerfile.lead
    container_name: traffic-funnel-lead
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # Email Automation Service
  email-automation:
    build:
      context: ./python-services
      dockerfile: Dockerfile.email
    container_name: traffic-funnel-email
    ports:
      - "8003:8003"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # Conversion Optimization Service
  conversion-optimizer:
    build:
      context: ./python-services
      dockerfile: Dockerfile.conversion
    container_name: traffic-funnel-conversion
    ports:
      - "8004:8004"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # Gumroad Integration Service
  gumroad-integration:
    build:
      context: ./python-services
      dockerfile: Dockerfile.gumroad
    container_name: traffic-funnel-gumroad
    ports:
      - "8005:8005"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - GUMROAD_ACCESS_TOKEN=${GUMROAD_ACCESS_TOKEN}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # Traffic Acquisition Service
  traffic-acquisition:
    build:
      context: ./python-services
      dockerfile: Dockerfile.traffic
    container_name: traffic-funnel-traffic
    ports:
      - "8006:8006"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      - FACEBOOK_ACCESS_TOKEN=${FACEBOOK_ACCESS_TOKEN}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # Social Media Service
  social-media:
    build:
      context: ./python-services
      dockerfile: Dockerfile.social
    container_name: traffic-funnel-social
    ports:
      - "8007:8007"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      - LLM_SERVICE_URL=http://llm-service:8008
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_started
    networks:
      - funnel-network
    restart: unless-stopped

  # Unified LLM Service
  llm-service:
    build:
      context: ./python-services
      dockerfile: Dockerfile.llm
    container_name: traffic-funnel-llm
    ports:
      - "8008:8008"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - funnel-network
    restart: unless-stopped

  # Node/Express/Mongoose backend (funnels/leads CRUD + real-time analytics
  # via Socket.IO) - was dead, uncommitted scaffold with no models until
  # this session; now real and tenant-scoped (see src/models/tenantPlugin.ts).
  # Was never listed here before because it was never a live service.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic-funnel-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/traffic-funnel
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-network
    restart: unless-stopped

  # empire_os API -- exposes the 36-engine governance/reasoning/research runtime
  empire-os-api:
    build:
      context: ../empire_os
      dockerfile: Dockerfile
    container_name: traffic-funnel-empire-os
    ports:
      - "8100:8100"
    networks:
      - funnel-network
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic-funnel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
      - NEXT_PUBLIC_EMPIRE_API_URL=http://localhost:8100
    depends_on:
      orchestrator:
        condition: service_started
      empire-os-api:
        condition: service_started
    networks:
      - funnel-network
    restart: unless-stopped


volumes:
  mongodb_data:
  redis_data:

networks:
  funnel-network:
    driver: bridge
